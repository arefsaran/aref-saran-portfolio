name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check formatting and source syntax
        run: npm run format:check && npm run lint
      - name: Build production output
        run: npm run build
      - name: Run portfolio quality suite
        run: npm test
      - name: Build production image
        run: docker build -t aref-saran-portfolio .
