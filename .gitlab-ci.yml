image: node:24-bookworm

stages:
  - quality

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

portfolio-quality:
  stage: quality
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps chromium
  script:
    - npm run format:check
    - npm run lint
    - npm run build
    - CI=true npm test
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
      - playwright-report/
      - test-results/
