server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /opt/portfolio;
  index index.html;

  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # The parent entrypoint replaces CLIENT_WSPATH and LISTENING_PORT at startup.
  # Keep this location ahead of the portfolio fallback so VPN traffic never
  # receives index.html.
  location CLIENT_WSPATH {
    proxy_redirect off;
    proxy_pass http://127.0.0.1:LISTENING_PORT;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
  }

  location ~* \.(?:png|jpg|jpeg|webp|svg|ico)$ {
    try_files $uri =404;
    expires 30d;
  }

  location ~* \.(?:css|js)$ {
    try_files $uri =404;
    expires 7d;
  }

  location ~ \.php$ {
    deny all;
  }

  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
